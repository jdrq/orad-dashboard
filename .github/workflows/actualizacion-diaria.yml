# Actualización diaria de los 17 archivos del MEF, en la nube (todos los días).
# Descarga -> valida 17/17 -> sube a Git -> verifica que la página publicada se actualizó.
# Si algo falla, la corrida queda en rojo y GitHub avisa por correo al dueño del repo.
name: Actualización diaria MEF

on:
  schedule:
    - cron: "7 12 * * *"   # 12:07 UTC = 07:07 hora de Lima (el MEF actualiza ~06:00)
    - cron: "7 17 * * *"   # 17:07 UTC = 12:07 hora de Lima (reintento de seguridad)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizacion-diaria
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright y Chromium
        run: |
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: Descargar, validar, subir y verificar
        run: python scripts/descargar_xls_mef.py --sin-pausa --headless

      - name: Cierre mensual automatico (solo actua si toca)
        run: python scripts/cierre_automatico.py

      - name: Registrar estado verificado (banner del dashboard)
        run: python scripts/generar_estado.py

      - name: Guardar log y capturas de error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-diario
          path: |
            logs/
            error_*.png
          if-no-files-found: ignore
          retention-days: 30